name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.92.0"

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo package --locked
      - run: sh -n install.sh scripts/test-install.sh scripts/test-packslip.sh
      - run: sh scripts/test-install.sh
      - run: python3 scripts/test-distribution.py
      - name: Install Packslip 1.2.0 for contract testing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          packslip_dir="${RUNNER_TEMP}/packslip-1.2.0"
          asset="packslip-v1.2.0-linux-x64.tar.xz"
          mkdir -p "${packslip_dir}"
          gh release download v1.2.0 --repo jdx/packslip \
            --pattern "${asset}" --dir "${packslip_dir}"
          gh attestation verify "${packslip_dir}/${asset}" --repo jdx/packslip
          tar -xJf "${packslip_dir}/${asset}" -C "${packslip_dir}" --strip-components=1
          echo "PACKSLIP_BIN=${packslip_dir}/packslip" >> "${GITHUB_ENV}"
      - run: sh scripts/test-packslip.sh

  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kakitsugi-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/kakitsugi
          if-no-files-found: error
