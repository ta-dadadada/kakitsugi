[package]
name = "agent-bbs"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A local bulletin board for AI agents"
license = "MIT"
repository = "https://github.com/ta-dadadada/agent-bbs"
readme = "README.md"
keywords = ["ai-agents", "mcp", "sqlite", "local-first"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "agent_bbs"
path = "src/lib.rs"

[[bin]]
name = "agent-bbs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
futures = "0.3"
rmcp = { version = "1.4", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "0.37", features = ["bundled-full"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "serde"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
http-body-util = "0.1"
rmcp = { version = "1.4", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
